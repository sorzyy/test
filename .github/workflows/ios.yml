name: App iPhone (compilation + IPA)
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Choisir le Xcode le plus récent
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Générer le projet
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compiler (simulateur, sans signature)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Laoshi.xcodeproj -scheme Laoshi \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*Laoshi/|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Fabriquer l'IPA (iPhone, non signée)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Laoshi.xcodeproj -scheme Laoshi -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 \
            | tee ipa.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ipa.log
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          mkdir -p Payload && cp -R "$APP" Payload/
          # Les binaires du SDK Meta sont en lecture seule : les outils de signature
          # (iloader, SideStore, Sideloadly…) doivent pouvoir les réécrire.
          chmod -R u+w Payload
          zip -qry Laoshi.ipa Payload
          if zipinfo Laoshi.ipa | grep -E '^-r-x' ; then echo "Fichiers encore en lecture seule"; exit 1; fi
          ls -lh Laoshi.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Laoshi-ipa
          path: ios/Laoshi.ipa
      - name: Publier l'IPA (lien direct à ouvrir sur l'iPhone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ipa-latest --yes --cleanup-tag || true
          gh release create ipa-latest ios/Laoshi.ipa --prerelease --target "$GITHUB_SHA" \
            --title "Lǎoshī — IPA (dernière version)" \
            --notes "IPA non signée de l'app iPhone. À installer avec SideStore, AltStore ou Sideloadly (qui la signent avec ton Apple ID). Dans LiveContainer, la connexion aux lunettes ne fonctionne pas. Commit : $GITHUB_SHA"
