# Déploiement en un clic sur Render (offre gratuite) :
# https://render.com/deploy?repo=https://github.com/sorzyy/test
services:
  - type: web
    name: saphir
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      # 512 Mo de RAM en offre gratuite : un seul processus yt-dlp gardé chaud
      - key: EXTRACT_WORKERS
        value: "1"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: MAX_FILESIZE_MB
        value: "500"
      - key: CORS_ORIGINS
        value: "https://sorzyy.github.io"
      # contenu de ton cookies.txt Instagram (optionnel, mais conseillé : voir le README)
      - key: COOKIES_TXT
        sync: false
