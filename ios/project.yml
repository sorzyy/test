# Génère le projet Xcode :  brew install xcodegen && xcodegen generate
name: Laoshi
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.2"
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: 1.0.1
targets:
  Laoshi:
    type: application
    platform: iOS
    sources: [Laoshi]
    info:
      path: Laoshi/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.laoshi
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        META_APP_ID: ""
        CLIENT_TOKEN: ""
        # DEVELOPMENT_TEAM: ABCDE12345   # ton Team ID Apple (Xcode › Signing)
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      # Bouton photo des lunettes (expérimental, à activer dans le Wearables Developer Center).
      - package: MetaWearablesDAT
        product: MWDATInputs
      # « Hey Meta, lance Lǎoshī » puis question à voix haute (expérimental, idem).
      - package: MetaWearablesDAT
        product: MWDATSpeech
